name: Android CI

on:
  push:
    branches: [ main, develop, fix/compose-ui-root-causes ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      # Use the same debug key whose SHA-1 is registered in Firebase.
      # Store its Base64 contents in the AIDROID_DEBUG_KEYSTORE_BASE64
      # repository Actions secret; never commit the keystore itself.
      - name: Restore Firebase debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.AIDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            echo "Using Firebase-registered debug signing key."
          else
            echo "::warning::AIDROID_DEBUG_KEYSTORE_BASE64 is missing. Google Sign-In may fail because this runner will generate a different debug key."
          fi

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Report debug signing certificate
        run: gradle :app:signingReport

      - name: Unit tests
        run: gradle :app:testDebugUnitTest

      - name: Assemble debug APK
        run: gradle :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aidroid-remaster-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
