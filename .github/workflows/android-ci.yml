name: Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest

      - name: Assemble release APK
        run: gradle :app:assembleRelease

      - name: Package release ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/aidroid-remaster-release
          cp app/build/outputs/apk/release/*.apk dist/aidroid-remaster-release/
          cat > dist/aidroid-remaster-release/BUILD-INFO.txt <<'EOF'
          Aidroid Remaster
          Build type: release
          Version: 0.2.0-alpha.9
          Application ID: app.aidroid.remaster
          Signing: unsigned (no release keystore is configured in this repository)
          EOF
          cd dist
          zip -r aidroid-remaster-release.zip aidroid-remaster-release

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: aidroid-remaster-release
          path: dist/aidroid-remaster-release.zip
          if-no-files-found: error
          retention-days: 14
